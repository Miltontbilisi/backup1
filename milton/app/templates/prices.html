<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILTON STUDIO | ღირებულების კალკულატორი</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-accent: #A98456;
            --dark-slate: #1A1A1A;
            --card-bg: #222222;
            --border-warm: rgba(169, 132, 86, 0.25);
            --global-padding: 8%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-slate);
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
        }

        header {
            padding: 30px var(--global-padding);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            letter-spacing: 4px;
            color: #FFFFFF;
            text-decoration: none;
        }

        .logo span {
            color: var(--gold-accent);
        }

        nav a {
            color: #E0E0E0;
            text-decoration: none;
            margin-left: 25px;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--gold-accent);
        }

        .calculator-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 var(--global-padding);
        }

        .title-block {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-block h1 {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .title-block p {
            font-size: 13px;
            color: #A0A0A0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            background: var(--card-bg);
            border: 1px solid var(--border-warm);
            padding: 40px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .calc-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--gold-accent);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .select-input, .range-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .select-input:focus {
            border-color: var(--gold-accent);
        }

        .select-input option {
            background: var(--dark-slate);
            color: #FFFFFF;
        }

        .val-display {
            float: right;
            color: #FFFFFF;
            font-weight: 600;
        }

        /* Result Panel */
        .result-panel {
            background: rgba(169, 132, 86, 0.08);
            border: 1px solid var(--gold-accent);
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: var(--gold-accent);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .price-breakdown {
            margin-bottom: 25px;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 12px;
            color: #CCCCCC;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--gold-accent);
        }

        .total-price {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: var(--gold-accent);
            font-weight: 600;
        }

        .book-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--gold-accent);
            color: #FFFFFF;
            padding: 16px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .book-btn:hover {
            background: #8E6D43;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">MILTON <span>STUDIO</span></a>
        <nav>
            <a href="/">მთავარი</a>
            <a href="/prices" class="active">ფასები & კალკულატორი</a>
            <a href="/shop">მაღაზია</a>
            <a href="/contact">კონტაქტი</a>
        </nav>
    </header>

    <div class="calculator-container">
        <div class="title-block">
            <h1>HAIR EXTENSION CALCULATOR</h1>
            <p>თმის დაგრძელების ინდივიდუალური ღირებულების გაანგარიშება</p>
        </div>

        <div class="calc-grid">
            <div class="calculator-inputs">
                <!-- Hair Type -->
                <div class="form-group">
                    <label for="hairType">თმის ტიპი</label>
                    <select id="hairType" class="select-input" onchange="calculatePrice()">
                        <option value="georgian">ქართული ნატურალური თმა</option>
                        <option value="slavic" selected>სლავური პრემიუმ თმა</option>
                        <option value="baby">ბავშვის ექსკლუზიური თმა (Baby Hair)</option>
                    </select>
                </div>

                <!-- Length Slider -->
                <div class="form-group">
                    <label for="length">თმის სიგრძე: <span id="lengthVal" class="val-display">50 სმ</span></label>
                    <input type="range" id="length" class="range-input" min="40" max="80" step="5" value="50" oninput="updateValues(); calculatePrice();">
                </div>

                <!-- Weight Slider -->
                <div class="form-group">
                    <label for="weight">თმის წონა: <span id="weightVal" class="val-display">100 გრამი</span></label>
                    <input type="range" id="weight" class="range-input" min="50" max="250" step="10" value="100" oninput="updateValues(); calculatePrice();">
                </div>
            </div>

            <!-- Result Box -->
            <div class="result-panel">
                <div>
                    <div class="result-title">MILTON ESTIMATE</div>
                    <div class="price-breakdown">
                        <div class="breakdown-row">
                            <span>თმის მასალა:</span>
                            <span id="hairCost">0 ₾</span>
                        </div>
                        <div class="breakdown-row">
                            <span>იტალიური კაფსულაცია & დაგრძელება:</span>
                            <span id="workCost">0 ₾</span>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="total-row">
                        <span>სულ ჯამში:</span>
                        <div class="total-price" id="totalPrice">0 ₾</div>
                    </div>
                    <a href="/contact" class="book-btn" style="margin-top: 25px;">კონსულტაციის დაჯავშნა</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Pricing structure per gram based on length and hair category (GEL)
        const rates = {
            georgian: { 40: 4.5, 45: 5.0, 50: 5.5, 55: 6.0, 60: 6.5, 65: 7.0, 70: 7.5, 75: 8.0, 80: 8.5 },
            slavic:   { 40: 6.5, 45: 7.2, 50: 8.0, 55: 8.8, 60: 9.5, 65: 10.3, 70: 11.0, 75: 11.8, 80: 12.5 },
            baby:     { 40: 9.5, 45: 10.5, 50: 11.5, 55: 12.5, 60: 13.5, 65: 14.5, 70: 15.5, 75: 16.5, 80: 17.5 }
        };

        const craftRatePerGram = 1.5; // Service & capsule installation cost per gram

        function updateValues() {
            document.getElementById('lengthVal').innerText = document.getElementById('length').value + ' სმ';
            document.getElementById('weightVal').innerText = document.getElementById('weight').value + ' გრამი';
        }

        function calculatePrice() {
            const type = document.getElementById('hairType').value;
            const length = parseInt(document.getElementById('length').value);
            const weight = parseInt(document.getElementById('weight').value);

            const hairRate = rates[type][length] || 8.0;
            const totalHairCost = Math.round(hairRate * weight);
            const totalWorkCost = Math.round(craftRatePerGram * weight);
            const total = totalHairCost + totalWorkCost;

            document.getElementById('hairCost').innerText = totalHairCost + ' ₾';
            document.getElementById('workCost').innerText = totalWorkCost + ' ₾';
            document.getElementById('totalPrice').innerText = total + ' ₾';
        }

        // Initialize calculation on page load
        calculatePrice();
    </script>
</body>
</html>
