<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MILTON STUDIO | Luxury Hair Salon{% endblock %}</title>

    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@swup/unpkg@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --gold-accent: #A98456;
            --dark-slate: #1A1A1A;
            --global-padding: 8%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-slate);
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            padding-top: 90px;
        }

        /* Architectural Floating Navbar */
        .milton-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 28px var(--global-padding);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background-color 0.4s ease, padding 0.4s ease, border-color 0.4s ease, backdrop-filter 0.4s ease;
        }

        /* Scrolled Glassmorphic State */
        .milton-navbar.scrolled {
            padding: 18px var(--global-padding);
            background-color: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(169, 132, 86, 0.25);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            letter-spacing: 4px;
            color: #FFFFFF;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .logo span {
            color: var(--gold-accent);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            color: #E0E0E0;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--gold-accent);
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold-accent);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cta-reserve {
            border: 1px solid var(--gold-accent);
            color: var(--gold-accent);
            padding: 10px 22px;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .cta-reserve:hover {
            background-color: var(--gold-accent);
            color: #FFFFFF;
        }

        /* Swup Animations */
        .transition-fade {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        html.is-animating .transition-fade {
            opacity: 0;
            transform: translateY(15px);
        }

        @media (max-width: 900px) {
            .nav-links {
                display: none;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Dynamic Header -->
    <header class="milton-navbar" id="miltonNavbar">
        <a href="/" class="logo">MILTON <span>STUDIO</span></a>

        <nav class="nav-links">
            <a href="/">მთავარი</a>
            <a href="/prices">ფასები & კალკულატორი</a>
            <a href="/shop">მაღაზია</a>
            <a href="/diagnostic">თმის დიაგნოსტიკა</a>
            <a href="/aftercare">მოვლის წესები</a>
            <a href="/contact">კონტაქტი</a>
        </nav>

        <div class="nav-actions">
            <a href="/contact" class="cta-reserve">ვიზიტი</a>
        </div>
    </header>

    <!-- Main Container for Page Swup Transitions -->
    <main id="swup" class="transition-fade">
        {% block content %}{% endblock %}
    </main>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Header Scroll Interaction Logic
        function initHeaderScroll() {
            const navbar = document.getElementById('miltonNavbar');
            if (!navbar) return;

            window.addEventListener('scroll', () => {
                if (window.scrollY > 40) {
                    navbar.classList.add('scrolled');
                } else {
                    navbar.classList.remove('scrolled');
                }
            });
        }

        // GSAP Entrance Animations
        function initAnimations() {
            gsap.from("#miltonNavbar", {
                duration: 1.2,
                y: -30,
                opacity: 0,
                ease: "power3.out"
            });
        }

        // Page Transitions Initializer
        const swup = new Swup();
        swup.hooks.on('page:view', () => {
            window.scrollTo(0, 0);
            initHeaderScroll();
            initAnimations();
        });

        document.addEventListener("DOMContentLoaded", () => {
            initHeaderScroll();
            initAnimations();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
